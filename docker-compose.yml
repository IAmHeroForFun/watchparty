version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: screenshare-app:latest
    container_name: screenshare-app
    restart: unless-stopped
    ports:
      # Bound to internal loopback on custom port 38282 so Nginx handles public SSL termination
      - "127.0.0.1:38282:38282"
    environment:
      - PORT=38282
      - HOST=0.0.0.0
      - NODE_ENV=production
      - NODE_OPTIONS=--experimental-strip-types
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
