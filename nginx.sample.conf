# ==============================================================================
# Sample Nginx Configuration for WatchParty / Screen Share Subdomain
# ==============================================================================
#
# USAGE INSTRUCTIONS:
# 1. Replace "stream.yourdomain.com" with your actual subdomain in this file.
# 2. Copy this file to your Nginx sites directory on AWS Lightsail:
#      sudo cp nginx.sample.conf /etc/nginx/sites-available/stream.conf
# 3. Enable the site:
#      sudo ln -s /etc/nginx/sites-available/stream.conf /etc/nginx/sites-enabled/
# 4. Generate your free SSL certificate with Certbot:
#      sudo certbot --nginx -d stream.yourdomain.com
# 5. Test configuration and reload Nginx:
#      sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Redirects all HTTP traffic to HTTPS)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name stream.yourdomain.com;

    # Allow Let's Encrypt ACME challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (SSL Termination & WebSocket Reverse Proxy)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stream.yourdomain.com;

    # SSL Certificate paths (Certbot will manage these automatically)
    ssl_certificate /etc/letsencrypt/live/stream.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.yourdomain.com/privkey.pem;

    # Modern TLS Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Gzip Compression for Fast Page Loads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff font/woff2;

    # --------------------------------------------------------------------------
    # Reverse Proxy to the Screen Share App (Docker on 127.0.0.1:38282)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:38282;

        # WebSocket Upgrade Headers (Mandatory for Socket.IO real-time signaling)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Client Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep persistent WebSocket connections alive without premature disconnects
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Buffer configurations
        proxy_buffering off;
    }
}
