# ==============================================================================
# Sample Nginx Configuration for StreamParty Subdomain
# ==============================================================================
#
# USAGE INSTRUCTIONS (Choose based on your Nginx setup):
#
# ------------------------------------------------------------------------------
# SCENARIO A: Your Nginx is running in Docker (Most common for Docker setups)
# ------------------------------------------------------------------------------
# 1. Connect both containers to the same Docker network:
#      docker network connect <YOUR_NGINX_NETWORK> screenshare-app
# 2. Copy this file into your Nginx container's mounted conf.d directory:
#      cp nginx.sample.conf /path/to/your/nginx/conf.d/stream.conf
# 3. In the proxy_pass directive below, use the container name:
#      proxy_pass http://screenshare-app:38282;
# 4. Reload your Nginx container:
#      docker exec -it <YOUR_NGINX_CONTAINER> nginx -s reload
#
# ------------------------------------------------------------------------------
# SCENARIO B: Your Nginx is running directly on the host (systemd)
# ------------------------------------------------------------------------------
# 1. Copy this file to /etc/nginx/sites-available/stream.conf
# 2. In the proxy_pass directive below, use loopback:
#      proxy_pass http://127.0.0.1:38282;
# 3. Enable and reload:
#      sudo ln -s /etc/nginx/sites-available/stream.conf /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Redirects all HTTP traffic to HTTPS)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name stream.yourdomain.com;

    # Allow Let's Encrypt ACME challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (SSL Termination & WebSocket Reverse Proxy)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stream.yourdomain.com;

    # SSL Certificate paths (managed by your Nginx Docker container / Certbot)
    ssl_certificate /etc/letsencrypt/live/stream.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.yourdomain.com/privkey.pem;

    # Modern TLS Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Gzip Compression for Fast Page Loads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff font/woff2;

    # --------------------------------------------------------------------------
    # Reverse Proxy to StreamParty App
    # --------------------------------------------------------------------------
    location / {
        # IF NGINX IS IN DOCKER (on shared network):
        proxy_pass http://screenshare-app:38282;

        # IF NGINX IS ON HOST SYSTEM:
        # proxy_pass http://127.0.0.1:38282;

        # IF NGINX IS IN DOCKER ACCESSING HOST DIRECTLY (without shared network):
        # proxy_pass http://172.17.0.1:38282;

        # WebSocket Upgrade Headers (Mandatory for Socket.IO real-time signaling)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Client Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep persistent WebSocket connections alive without premature disconnects
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Buffer configurations
        proxy_buffering off;
    }
}
