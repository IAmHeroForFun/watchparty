# ==============================================================================
# StreamParty — Ready-to-Append Nginx Block for /opt/services/omvi_blog/nginx/default.conf
# ==============================================================================

upstream streamparty {
    server screenshare-app:38282;
}

server {
    listen 80;
    server_name stream.omvihub.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name stream.omvihub.in;

    ssl_certificate /etc/letsencrypt/live/stream.omvihub.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.omvihub.in/privkey.pem;

    location / {
        proxy_pass http://streamparty;

        # WebSocket Upgrade Headers (Mandatory for real-time WebRTC signaling)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Client Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Keep persistent WebSocket connections alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }
}
